<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">After Action Journal — case card</title>
  <desc id="desc">A social card for After Action Journal, with a wordmark on the left and a constellation mark on the right.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F2EDE3"/><stop offset="100%" stop-color="#E8DFCC"/>
    </linearGradient>
    <radialGradient id="orbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#CC785C" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#CC785C" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#CC785C" stop-opacity="0"/>
    </radialGradient>
    <style>
      .serif { font-family: "Iowan Old Style", Georgia, "Times New Roman", serif; }
      .sans { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
      .wordmark { font-weight: 600; fill: #2D2A26; letter-spacing: -2px; }
      .tagline { font-size: 26px; font-weight: 400; fill: #6B5F52; }
      .eyebrow { font-size: 14px; font-weight: 600; fill: #8B7E6F; letter-spacing: 4px; }
      .footer { font-size: 16px; font-weight: 600; fill: #6B5F52; letter-spacing: 1px; }
    </style>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="930" cy="315" r="280" fill="url(#orbGlow)"/>
  <text x="80" y="138" class="sans eyebrow">APP BUILD</text>
  <text x="80" y="214" class="serif wordmark" font-size="118">After Action</text>
  <text x="80" y="334" class="serif wordmark" font-size="118">Journal</text>
  <line x1="80" y1="368" x2="160" y2="368" stroke="#CC785C" stroke-width="2.5" stroke-linecap="round"/>
  <text x="80" y="420" class="serif tagline" font-style="italic">A reflective operations journal that turns</text>
  <text x="80" y="460" class="serif tagline" font-style="italic">field notes into structured learning loops.</text>
  <text x="80" y="560" class="sans footer">liamday.co.uk</text>
  <line x1="80" y1="575" x2="220" y2="575" stroke="#8B7E6F" stroke-width="1" stroke-opacity="0.4"/>
  <g transform="translate(930,315)">
    <g fill="#FFFFFF" stroke="#3D3929" stroke-width="1.5">
      <circle cx="0" cy="-150" r="20"/><circle cx="106" cy="-106" r="20"/>
      <circle cx="150" cy="0" r="20"/><circle cx="106" cy="106" r="20"/>
      <circle cx="0" cy="150" r="20"/><circle cx="-106" cy="106" r="20"/>
      <circle cx="-150" cy="0" r="20"/><circle cx="-106" cy="-106" r="20"/>
    </g>
    <g stroke="#CC785C" stroke-width="1" stroke-opacity="0.45" fill="none">
      <line x1="0" y1="-42" x2="0" y2="-128"/><line x1="30" y1="-30" x2="84" y2="-84"/>
      <line x1="42" y1="0" x2="128" y2="0"/><line x1="30" y1="30" x2="84" y2="84"/>
      <line x1="0" y1="42" x2="0" y2="128"/><line x1="-30" y1="30" x2="-84" y2="84"/>
      <line x1="-42" y1="0" x2="-128" y2="0"/><line x1="-30" y1="-30" x2="-84" y2="-84"/>
    </g>
    <circle r="42" fill="#CC785C"/>
    <circle r="42" fill="none" stroke="#a85c44" stroke-width="2"/>
  </g>
</svg>
