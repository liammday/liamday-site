<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" role="img" aria-labelledby="cpn-hero-title-l cpn-hero-desc-l" preserveAspectRatio="xMidYMid slice">
  <title id="cpn-hero-title-l">Career Pivot Navigator</title>
  <desc id="cpn-hero-desc-l">A wayfinding field on warm light: faint topographic contours, an origin hub with a bearing ring, and routes fanning out to candidate destinations. One route is lit in ember and ends at a flagged, ranked destination — the recommended civilian occupation, every other route still a real option.</desc>

  <defs>
    <radialGradient id="cpn-hero-bg-l" cx="32%" cy="55%" r="80%">
      <stop offset="0%" stop-color="#faf6f0"/>
      <stop offset="60%" stop-color="#f3ede3"/>
      <stop offset="100%" stop-color="#ece2d4"/>
    </radialGradient>
    <radialGradient id="cpn-hero-glow-l" cx="30%" cy="55%" r="55%">
      <stop offset="0%" stop-color="#cc785c" stop-opacity="0.16"/>
      <stop offset="45%" stop-color="#cc785c" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#cc785c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cpn-hero-hub-l" cx="40%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#d87435"/>
      <stop offset="55%" stop-color="#cc785c"/>
      <stop offset="100%" stop-color="#a85c44"/>
    </radialGradient>
    <linearGradient id="cpn-hero-route-l" x1="470" y1="440" x2="1180" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#cc785c" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#b34d09" stop-opacity="0.78"/>
      <stop offset="100%" stop-color="#b34d09" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Warm light field + glow -->
  <rect width="1600" height="800" fill="url(#cpn-hero-bg-l)"/>
  <circle cx="470" cy="440" r="430" fill="url(#cpn-hero-glow-l)"/>

  <!-- Faint topographic contours -->
  <g fill="none" stroke="#5b5650" stroke-opacity="0.12" stroke-width="1.5">
    <path d="M-20 250 C 300 180, 700 300, 1000 210 S 1500 150, 1650 240"/>
    <path d="M-20 360 C 320 300, 720 420, 1040 330 S 1520 280, 1650 360"/>
    <path d="M-20 480 C 300 430, 760 560, 1080 470 S 1520 420, 1650 500"/>
    <path d="M-20 600 C 340 560, 760 680, 1100 600 S 1520 560, 1650 630"/>
  </g>

  <!-- Bearing ring around origin -->
  <g fill="none" stroke="#cc785c" stroke-opacity="0.24">
    <circle cx="470" cy="440" r="64"/>
    <circle cx="470" cy="440" r="96"/>
  </g>
  <g stroke="#5b5650" stroke-opacity="0.22" stroke-width="1.5">
    <line x1="470" y1="360" x2="470" y2="344"/>
    <line x1="470" y1="520" x2="470" y2="536"/>
    <line x1="390" y1="440" x2="374" y2="440"/>
    <line x1="550" y1="440" x2="566" y2="440"/>
  </g>

  <!-- Soft routes to the other candidate destinations -->
  <g fill="none" stroke="#cc785c" stroke-opacity="0.40" stroke-width="2" stroke-dasharray="2 9" stroke-linecap="round">
    <path d="M470 440 C 760 420, 900 340, 1010 312"/>
    <path d="M470 440 C 800 470, 1040 470, 1232 472"/>
    <path d="M470 440 C 760 520, 940 600, 1066 640"/>
    <path d="M470 440 C 800 500, 1000 540, 1128 552"/>
  </g>

  <!-- Lit route to the recommended destination -->
  <path d="M470 440 C 780 380, 980 300, 1176 252" fill="none" stroke="url(#cpn-hero-route-l)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Candidate destination waypoints -->
  <g fill="#2a2622" fill-opacity="0.82">
    <circle cx="1010" cy="312" r="7"/>
    <circle cx="1232" cy="472" r="7"/>
    <circle cx="1066" cy="640" r="6.5"/>
    <circle cx="1128" cy="552" r="6.5"/>
  </g>

  <!-- Recommended destination: flagged + ringed -->
  <g>
    <circle cx="1176" cy="252" r="9" fill="#2a2622"/>
    <circle cx="1176" cy="252" r="16" fill="none" stroke="#b34d09" stroke-opacity="0.85" stroke-width="1.5"/>
    <line x1="1176" y1="252" x2="1176" y2="206" stroke="#b34d09" stroke-opacity="0.9" stroke-width="2"/>
    <path d="M1176 208 L1212 216 L1176 226 Z" fill="#cc785c"/>
  </g>

  <!-- Origin hub -->
  <circle cx="470" cy="440" r="30" fill="url(#cpn-hero-hub-l)"/>
  <ellipse cx="461" cy="431" rx="10" ry="4" fill="#fdeee0" opacity="0.55"/>
</svg>
