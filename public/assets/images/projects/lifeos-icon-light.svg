<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="lifeos-icon-title-l">
  <title id="lifeos-icon-title-l">LifeOS</title>
  <defs>
    <radialGradient id="lifeos-icon-bg-l" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#faf6f0"/>
      <stop offset="60%" stop-color="#f3ede3"/>
      <stop offset="100%" stop-color="#ece2d4"/>
    </radialGradient>
    <radialGradient id="lifeos-icon-spine-glow-l" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.06"/>
      <stop offset="60%" stop-color="#000000" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lifeos-icon-spine-fill-l" cx="38%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#d87435"/>
      <stop offset="55%" stop-color="#cc785c"/>
      <stop offset="100%" stop-color="#9c5236"/>
    </radialGradient>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#lifeos-icon-bg-l)"/>

  <!-- Soft shadow behind the spine (replaces the dark-theme bright bloom) -->
  <circle cx="128" cy="128" r="58" fill="url(#lifeos-icon-spine-glow-l)"/>

  <!-- Eight radial connectors from spine surface to node inner edge -->
  <g stroke="#b34d09" stroke-opacity="0.4" stroke-width="1.5" stroke-linecap="round" fill="none">
    <line x1="149.6" y1="128" x2="177.8" y2="128"/>
    <line x1="142.8" y1="114.1" x2="159.7" y2="90.1"/>
    <line x1="128" y1="109" x2="128" y2="78.2"/>
    <line x1="113.2" y1="114.1" x2="96.3" y2="90.1"/>
    <line x1="106.4" y1="128" x2="78.2" y2="128"/>
    <line x1="113.2" y1="141.9" x2="96.3" y2="165.9"/>
    <line x1="128" y1="147" x2="128" y2="177.8"/>
    <line x1="142.8" y1="141.9" x2="159.7" y2="165.9"/>
  </g>

  <!-- Eight constellation nodes -->
  <g fill="#2a2622">
    <circle cx="182" cy="128" r="6.5"/>
    <circle cx="163.6" cy="82.4" r="6.5"/>
    <circle cx="128" cy="64" r="6.5"/>
    <circle cx="92.4" cy="82.4" r="6.5"/>
    <circle cx="74" cy="128" r="6.5"/>
    <circle cx="92.4" cy="173.6" r="6.5"/>
    <circle cx="128" cy="192" r="6.5"/>
    <circle cx="163.6" cy="173.6" r="6.5"/>
  </g>

  <!-- Central spine: ember oval with subtle highlight -->
  <ellipse cx="128" cy="128" rx="39" ry="32" fill="url(#lifeos-icon-spine-fill-l)"/>
  <ellipse cx="118.5" cy="117.5" rx="15" ry="5" fill="#fdeee0" opacity="0.55"/>
</svg>
